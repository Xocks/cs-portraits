<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照片质量审核 · CS 选手图鉴</title><link rel="stylesheet" href="/review.css"></head><body>
<header><div><span class="eyebrow">CS 选手图鉴 / 本地审核</span><h1>照片质量审核</h1><p>只评画面质量，不评选手长相。</p></div><div class="header-actions"><span id="save-status" role="status">加载中…</span><a href="/api/export" class="subtle">导出 JSON 备份</a><button id="export-csv" class="subtle">导出评分表</button></div></header>
<main><section class="progress"><div><strong id="done">0</strong><span>已评质量</span></div><div><strong id="remaining">0</strong><span>待你审核</span></div><div><strong id="usable">0</strong><span>4–5 分</span></div><div class="progress-track"><i id="progress-fill"></i></div><small id="progress-text"></small></section>
<section class="filters" aria-label="筛选照片"><label>查看<select id="status-filter"><option value="pending">待审核（排除此前已审）</option><option value="unrated">全部未评分</option><option value="rated">我已评分</option><option value="usable">4–5 分</option><option value="poor">1–2 分</option><option value="borderline">3 分待比较</option><option value="deferred">暂存待定</option><option value="identity-mismatch">人物不符</option><option value="all">全部照片</option></select></label><label>战队<select id="team-filter"><option value="all">全部 Top20 战队</option></select></label><label>年份<select id="year-filter"><option value="all">所有年份</option></select></label><label class="search">搜索<input id="search" placeholder="选手或赛事" type="search"></label><label class="advance"><input type="checkbox" id="auto-next" checked>评分后自动下一张</label></section>
<section id="workspace" class="workspace"><div class="photo-panel"><div class="photo-toolbar"><span id="position"></span><div><button id="portrait-view" class="active" aria-pressed="true">人像裁切</button><button id="original-view" aria-pressed="false">完整原图</button></div></div><div class="image-stage"><img id="photo" alt="待审核照片"><span id="loading-image">照片加载中…</span></div><div class="photo-navigation"><button id="previous">← 上一张</button><span>← → 切换 · 1–5 评分 · 空格待定</span><button id="next">下一张 →</button></div></div>
<aside><div class="identity"><div><span id="team" class="eyebrow"></span><h2 id="nickname"></h2><p id="real-name"></p><span id="year" class="year"></span></div><div class="reference"><img id="reference" alt="官方档案参考头像"><small>档案参考 · 拍摄年份未知</small></div></div><h3 id="event"></h3><p id="previous-status" class="previous-status"></p><div class="source-links"><a id="source" target="_blank" rel="noreferrer">照片来源 ↗</a><a id="year-source" target="_blank" rel="noreferrer">年份依据 ↗</a></div>
<div class="rating-area"><h3>这张照片的质量如何？</h3><p>看清晰度、遮挡、光线和构图。4–5 分优先用于网站。</p><div class="scores" role="group" aria-label="照片质量评分"><button data-score="1"><strong>1</strong><span>无法使用</span></button><button data-score="2"><strong>2</strong><span>较差</span></button><button data-score="3"><strong>3</strong><span>待比较</span></button><button data-score="4"><strong>4</strong><span>清晰可用</span></button><button data-score="5"><strong>5</strong><span>优先保留</span></button></div><div id="current-score" class="current-score" aria-live="polite"></div><div class="secondary-actions"><button id="defer">暂存待定</button><button id="mismatch">人物不符</button><button id="clear">清除本张评分</button></div></div>
<label class="notes-label">备注（可选）<textarea id="notes" rows="3" maxlength="1000" placeholder="如：失焦、面部遮挡、头顶裁切过紧…"></textarea></label><button id="save-note" class="subtle">保存备注</button><p class="local-note">进度自动保存到本机；刷新或重新打开后可继续。此处的质量分与网站里的选手评分分开，不会自动发布照片。</p></aside></section>
<section id="empty" hidden class="empty"><h2>这一组已审核完</h2><p>可以切换战队、年份或查看已评分照片。</p><button id="show-all">查看全部照片</button></section>
<footer>保存文件：<code id="storage"></code></footer></main><script type="module" src="/review.js"></script></body></html>
